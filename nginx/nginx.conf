worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Consolidación SEO: guías genéricas de seguros -> página pilar única
        location ~ ^/(mejor-seguro-de-viaje-2026|seguros-de-viaje-con-descuento)/?$ {
            return 301 /mejor-seguro-de-viaje;
        }

        # Oleada Patagonia: URL con errata en WordPress y página «home» heredada
        location ~ ^/que-by-hacer-en-los-altares-chubut/?$ {
            return 301 /que-ver-y-hacer-en-los-altares-chubut;
        }

        location ~ ^/home/?$ {
            return 301 /;
        }

        # Oleada Siberia: índice antiguo de Rusia -> guía pilar
        location ~ ^/entradas-rusia/?$ {
            return 301 /guia-siberia;
        }

        # Oleada Viajar siendo sordo: páginas heredadas de WordPress
        location ~ ^/entrevistas/?$ {
            return 301 /viajar-siendo-sordo;
        }

        location ~ ^/colabora/?$ {
            return 301 /contacto;
        }

        location ~ ^/vuelta-al-mundo-con-mochila-y-proyecto-inclusivo/?$ {
            return 301 /acerca-de;
        }

        location / {
            try_files $uri $uri/index.html =404;
        }
    }
}