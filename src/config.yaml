site:
  name: Mochileando sin Barreras
  # URL final de producción. Se usa para canonical, sitemap, robots.txt y Open Graph.
  # En local no afecta: `npm run dev` sigue funcionando en localhost.
  site: 'https://mochileandosinbarreras.com'
  base: '/'
  trailingSlash: false

  # ID de verificación de Google Search Console (etiqueta meta).
  # El que había era el de la plantilla AstroWind, así que lo dejo vacío.
  # Si verificas por etiqueta HTML, pega aquí SOLO el valor de `content`.
  googleSiteVerificationId: ''

# SEO por defecto (se usa cuando una página no define el suyo)
metadata:
  title:
    default: Mochileando sin Barreras
    template: '%s'
  description: Guías de viaje honestas, seguros y eSIM probados en ruta de Argentina a Alaska en camper, por una pareja que viaja sin barreras.
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Mochileando sin Barreras
    locale: es_ES
    type: website
    images:
      - url: '~/assets/images/og-default.jpg'
        width: 1200
        height: 630
  twitter:
    # Sin @usuario de X/Twitter: no se emiten twitter:site ni twitter:creator.
    # Cuando tengas uno añade `handle: '@tuusuario'` y `site: '@tuusuario'`.
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: "G-Z35G79DLWN" # solo se carga si el usuario acepta la analítica (CookieConsent.astro)

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
